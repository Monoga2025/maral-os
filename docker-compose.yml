version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: maral-os-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maral}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maral2024}
      POSTGRES_DB: ${POSTGRES_DB:-maral_os}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maral -d maral_os"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maral-os-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-maral}:${POSTGRES_PASSWORD:-maral2024}@postgres:5432/${POSTGRES_DB:-maral_os}
      JWT_SECRET: ${JWT_SECRET:-super-secret-change-in-production-maral-os}
      PORT: 3001
      NODE_ENV: production
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: maral-os-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
