<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="maral-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0F172A" />
  <circle cx="256" cy="256" r="180" fill="url(#maral-grad)" opacity="0.15" filter="url(#glow)" />
  <circle cx="256" cy="256" r="160" stroke="url(#maral-grad)" stroke-width="8" fill="none" opacity="0.4" />
  
  <!-- Antenna waves -->
  <path d="M 176 180 A 110 110 0 0 1 336 180" fill="none" stroke="#38BDF8" stroke-width="14" stroke-linecap="round" opacity="0.6"/>
  <path d="M 206 210 A 70 70 0 0 1 306 210" fill="none" stroke="#60A5FA" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
  <circle cx="256" cy="245" r="14" fill="#60A5FA" />
  
  <!-- Central M Symbol -->
  <path d="M 160 360 L 160 260 L 256 330 L 352 260 L 352 360" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
</svg>
