<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual" />
    <title>MARAL OS - Gestión Empresarial</title>
    <meta name="description" content="Sistema operativo y gestión de tareas, taller, pedidos y cartera de MARAL Antenas" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MARAL OS" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Auto-recovery for chunk load errors & dynamic import failures
      window.addEventListener('error', function(e) {
        if (e && e.message && (e.message.includes('dynamically imported') || e.message.includes('Loading chunk') || e.message.includes('Failed to fetch') || e.message.includes('SyntaxError'))) {
          console.warn('Detectado error de versión/módulo. Recuperando automáticamente...', e.message);
          if (!sessionStorage.getItem('maral_auto_recover')) {
            sessionStorage.setItem('maral_auto_recover', '1');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (var i = 0; i < regs.length; i++) regs[i].unregister();
                window.location.reload();
              });
            } else {
              window.location.reload();
            }
          }
        }
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            reg.update().catch(function() {});
          }).catch(function() {});
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
